<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow | Produktivitas Interaktif</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- Global Styles --- */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- Glassmorphism Card --- */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            transition: transform 0.3s ease;
        }
        
        .glass-panel:hover {
            transform: translateY(-5px);
        }

        /* --- Circular Progress Timer --- */
        .timer-circle {
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        .timer-circle circle {
            transition: stroke-dashoffset 1s linear;
        }

        /* --- Task List Animation --- */
        .task-item {
            transition: all 0.3s ease;
        }
        .task-item.completed {
            opacity: 0.6;
            text-decoration: line-through;
            background: rgba(209, 250, 229, 0.5); /* Hijau pudar */
        }
        .task-item.removing {
            transform: translateX(100%);
            opacity: 0;
        }

        /* --- Breathing Animation --- */
        .breathing-circle {
            width: 150px;
            height: 150px;
            background: rgba(99, 102, 241, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 0 auto;
        }
        .breathing-core {
            width: 100px;
            height: 100px;
            background: #6366f1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.6);
            transition: all 4s ease-in-out;
        }
        
        /* Animasi Tarik/Hembus Napas */
        .inhale .breathing-core {
            transform: scale(1.4);
            background: #818cf8;
        }
        .exhale .breathing-core {
            transform: scale(1);
            background: #6366f1;
        }
        .text-guide {
            position: absolute;
            bottom: -20px;
            width: 100%;
            text-align: center;
            font-weight: 600;
            color: #4f46e5;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .show-text {
            opacity: 1;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1); 
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.2); 
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4 md:p-8">

    <!-- Header -->
    <header class="w-full max-w-5xl flex justify-between items-center mb-8 glass-panel px-6 py-4">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-layer-group text-2xl text-indigo-600"></i>
            <h1 class="text-2xl font-bold text-gray-800">FocusFlow</h1>
        </div>
        <div class="text-sm font-medium text-gray-600 hidden md:block" id="current-date">
            <!-- Date injected by JS -->
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Column: Timer & Breathing (Cols 5) -->
        <div class="lg:col-span-5 flex flex-col gap-6">
            
            <!-- Timer Card -->
            <div class="glass-panel p-6 flex flex-col items-center justify-center relative">
                <h2 class="text-lg font-semibold text-gray-700 mb-4 self-start flex items-center gap-2">
                    <i class="fa-regular fa-clock text-indigo-500"></i> Timer Fokus
                </h2>

                <!-- SVG Circle Progress -->
                <div class="relative mb-6">
                    <svg class="timer-circle" width="200" height="200">
                        <circle stroke="#e5e7eb" stroke-width="8" fill="transparent" r="88" cx="100" cy="100"/>
                        <circle id="progress-ring" stroke="#6366f1" stroke-width="8" fill="transparent" r="88" cx="100" cy="100"
                                stroke-dasharray="553" stroke-dashoffset="0" stroke-linecap="round"/>
                    </svg>
                    <div class="absolute top-0 left-0 w-full h-full flex flex-col items-center justify-center">
                        <span id="timer-display" class="text-5xl font-bold text-gray-800 font-mono">30:00</span>
                        <span id="timer-status" class="text-xs font-semibold text-indigo-500 mt-1 uppercase tracking-wider">Fokus</span>
                    </div>
                </div>

                <!-- Timer Controls -->
                <div class="flex gap-4 w-full justify-center">
                    <button id="btn-start" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-full font-medium transition shadow-lg flex items-center gap-2">
                        <i class="fa-solid fa-play"></i> Mulai
                    </button>
                    <button id="btn-pause" class="hidden bg-yellow-500 hover:bg-yellow-600 text-white px-6 py-2 rounded-full font-medium transition shadow-lg flex items-center gap-2">
                        <i class="fa-solid fa-pause"></i> Jeda
                    </button>
                    <button id="btn-reset" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-full font-medium transition flex items-center gap-2">
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                </div>

                <!-- Timer Modes -->
                <div class="flex gap-2 mt-6 bg-white/50 p-1 rounded-lg">
                    <button onclick="setMode('pomodoro')" class="px-4 py-1 text-xs font-bold rounded-md bg-indigo-100 text-indigo-700 transition" id="mode-pomodoro">Fokus</button>
                    <button onclick="setMode('short')" class="px-4 py-1 text-xs font-bold rounded-md text-gray-500 hover:bg-gray-100 transition" id="mode-short">Istirahat</button>
                </div>
            </div>

            <!-- Breathing Exercise Card -->
            <div class="glass-panel p-6 flex flex-col items-center text-center">
                <h2 class="text-lg font-semibold text-gray-700 mb-6 self-start flex items-center gap-2">
                    <i class="fa-solid fa-lungs text-teal-500"></i> Pernapasan
                </h2>
                <div class="relative py-4 mb-4">
                    <div class="breathing-circle" id="breath-container">
                        <div class="breathing-core">
                            <i class="fa-solid fa-om text-3xl"></i>
                        </div>
                    </div>
                    <div class="text-guide" id="breath-text">Tarik Napas...</div>
                </div>
                <button id="btn-breath" class="mt-4 text-sm bg-teal-500 hover:bg-teal-600 text-white px-5 py-2 rounded-lg shadow transition">
                    Mulai Relaksasi
                </button>
            </div>
        </div>

        <!-- Right Column: Task List (Cols 7) -->
        <div class="lg:col-span-7 glass-panel p-6 flex flex-col h-full">
            <h2 class="text-lg font-semibold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-list-check text-pink-500"></i> Daftar Tugas
            </h2>

            <!-- Input Area -->
            <!-- UBAH DISINI: 'max-w-xs' agar pendek di HP, 'md:max-w-lg' agar panjang di Desktop -->
            <div class="flex gap-2 mb-6 w-full max-w-xs md:max-w-lg">
                <input type="text" id="task-input" placeholder="Tugas hari ini?" 
                    class="flex-1 px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400 bg-white/60 backdrop-blur-sm min-w-0 text-sm md:text-base">
                <button id="add-task-btn" class="bg-pink-500 hover:bg-pink-600 text-white px-4 md:px-6 rounded-xl font-bold transition shadow-md whitespace-nowrap">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>

            <!-- Stats -->
            <div class="flex justify-between items-center text-xs text-gray-500 mb-2 px-2">
                <span id="task-count">0 Tugas</span>
                <button onclick="clearCompleted()" class="hover:text-pink-600 transition underline">Hapus yang selesai</button>
            </div>

            <!-- Task List Container -->
            <div id="task-list" class="flex-1 overflow-y-auto space-y-3 pr-2" style="max-height: 400px;">
                <!-- Empty State -->
                <div id="empty-state" class="text-center py-10 opacity-50">
                    <i class="fa-solid fa-clipboard-list text-4xl mb-3 text-gray-400"></i>
                    <p>Belum ada tugas. Ayo semangat bro jangan malas malasan</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="mt-8 text-white/80 text-sm font-light">
        <p>&copy; 2026 FocusFlow. By Raha</p>
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        /* --- 1. DATE LOGIC --- */
        const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('id-ID', dateOptions);

        /* --- 2. TIMER LOGIC --- */
        let timerInterval;
        let timeLeft = 30 * 60; // seconds
        let totalTime = 30 * 60;
        let isRunning = false;
        
        const timerDisplay = document.getElementById('timer-display');
        const progressRing = document.getElementById('progress-ring');
        const btnStart = document.getElementById('btn-start');
        const btnPause = document.getElementById('btn-pause');
        const btnReset = document.getElementById('btn-reset');
        
        // Setup Circle SVG
        const radius = progressRing.r.baseVal.value;
        const circumference = radius * 2 * Math.PI;
        progressRing.style.strokeDasharray = `${circumference} ${circumference}`;
        progressRing.style.strokeDashoffset = 0;

        function setProgress(percent) {
            const offset = circumference - (percent / 100) * circumference;
            progressRing.style.strokeDashoffset = offset;
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function updateTimer() {
            if (timeLeft > 0) {
                timeLeft--;
                timerDisplay.textContent = formatTime(timeLeft);
                const percent = (timeLeft / totalTime) * 100;
                setProgress(percent);
            } else {
                clearInterval(timerInterval);
                isRunning = false;
                timerDisplay.textContent = "00:00";
                // Play sound or alert
                alert("Waktu Habis! Istirahat sejenak.");
                resetTimerState();
            }
        }

        function toggleTimer() {
            if (!isRunning) {
                isRunning = true;
                timerInterval = setInterval(updateTimer, 1000);
                btnStart.classList.add('hidden');
                btnPause.classList.remove('hidden');
            } else {
                clearInterval(timerInterval);
                isRunning = false;
                btnStart.classList.remove('hidden');
                btnPause.classList.add('hidden');
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            // Reset to current mode time
            const currentMode = document.getElementById('mode-pomodoro').classList.contains('bg-indigo-100') ? 30 : 5;
            timeLeft = currentMode * 60;
            totalTime = timeLeft;
            timerDisplay.textContent = formatTime(timeLeft);
            setProgress(100);
            resetTimerState();
        }

        function resetTimerState() {
            btnStart.classList.remove('hidden');
            btnPause.classList.add('hidden');
            btnStart.innerHTML = '<i class="fa-solid fa-play"></i> Mulai';
        }

        function setMode(mode) {
            clearInterval(timerInterval);
            isRunning = false;
            resetTimerState();

            const modePomo = document.getElementById('mode-pomodoro');
            const modeShort = document.getElementById('mode-short');
            const statusText = document.getElementById('timer-status');

            if (mode === 'pomodoro') {
                timeLeft = 30 * 60;
                statusText.textContent = "Fokus";
                statusText.className = "text-xs font-semibold text-indigo-500 mt-1 uppercase tracking-wider";
                progressRing.style.stroke = "#6366f1"; // Indigo
                
                modePomo.className = "px-4 py-1 text-xs font-bold rounded-md bg-indigo-100 text-indigo-700 transition";
                modeShort.className = "px-4 py-1 text-xs font-bold rounded-md text-gray-500 hover:bg-gray-100 transition";
            } else {
                timeLeft = 5 * 60;
                statusText.textContent = "Istirahat";
                statusText.className = "text-xs font-semibold text-teal-500 mt-1 uppercase tracking-wider";
                progressRing.style.stroke = "#14b8a6"; // Teal

                modeShort.className = "px-4 py-1 text-xs font-bold rounded-md bg-teal-100 text-teal-700 transition";
                modePomo.className = "px-4 py-1 text-xs font-bold rounded-md text-gray-500 hover:bg-gray-100 transition";
            }
            totalTime = timeLeft;
            timerDisplay.textContent = formatTime(timeLeft);
            setProgress(100);
        }

        btnStart.addEventListener('click', toggleTimer);
        btnPause.addEventListener('click', toggleTimer);
        btnReset.addEventListener('click', resetTimer);

        /* --- 3. TODO LIST LOGIC --- */
        const taskInput = document.getElementById('task-input');
        const addTaskBtn = document.getElementById('add-task-btn');
        const taskList = document.getElementById('task-list');
        const emptyState = document.getElementById('empty-state');
        const taskCount = document.getElementById('task-count');

        let tasks = [];

        function renderTasks() {
            taskList.innerHTML = '';
            
            if (tasks.length === 0) {
                taskList.appendChild(emptyState);
                taskCount.textContent = "0 Tugas";
                return;
            }

            // Move empty state out if tasks exist
            if(emptyState.parentNode === taskList) taskList.removeChild(emptyState);

            tasks.forEach((task, index) => {
                const div = document.createElement('div');
                div.className = `task-item flex items-center justify-between p-3 bg-white/80 rounded-lg shadow-sm ${task.completed ? 'completed' : ''}`;
                
                div.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <button onclick="toggleTask(${index})" class="w-6 h-6 rounded-full border-2 flex items-center justify-center transition ${task.completed ? 'bg-pink-500 border-pink-500 text-white' : 'border-gray-300 text-transparent hover:border-pink-400'}">
                            <i class="fa-solid fa-check text-xs"></i>
                        </button>
                        <span class="truncate font-medium text-gray-700">${task.text}</span>
                    </div>
                    <button onclick="deleteTask(${index})" class="text-gray-400 hover:text-red-500 transition px-2">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                `;
                taskList.appendChild(div);
            });

            const activeCount = tasks.filter(t => !t.completed).length;
            taskCount.textContent = `${activeCount} Tugas Tersisa`;
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (text) {
                tasks.push({ text: text, completed: false });
                taskInput.value = '';
                renderTasks();
            }
        }

        window.toggleTask = function(index) {
            tasks[index].completed = !tasks[index].completed;
            renderTasks();
        }

        window.deleteTask = function(index) {
            const items = document.querySelectorAll('.task-item');
            if(items[index]) {
                items[index].classList.add('removing');
                setTimeout(() => {
                    tasks.splice(index, 1);
                    renderTasks();
                }, 300);
            }
        }

        window.clearCompleted = function() {
            tasks = tasks.filter(t => !t.completed);
            renderTasks();
        }

        addTaskBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        /* --- 4. BREATHING LOGIC --- */
        const btnBreath = document.getElementById('btn-breath');
        const breathContainer = document.getElementById('breath-container');
        const breathText = document.getElementById('breath-text');
        let isBreathing = false;
        let breathInterval;

        btnBreath.addEventListener('click', () => {
            if (!isBreathing) {
                startBreathing();
            } else {
                stopBreathing();
            }
        });

        function startBreathing() {
            isBreathing = true;
            btnBreath.textContent = "Berhenti";
            btnBreath.classList.replace('bg-teal-500', 'bg-red-400');
            btnBreath.classList.replace('hover:bg-teal-600', 'hover:bg-red-500');
            
            breathCycle();
            breathInterval = setInterval(breathCycle, 8000); // 4s inhale, 4s exhale
        }

        function stopBreathing() {
            isBreathing = false;
            clearInterval(breathInterval);
            breathContainer.className = "breathing-circle"; // Reset class
            breathText.classList.remove('show-text');
            btnBreath.textContent = "Mulai Relaksasi";
            btnBreath.classList.replace('bg-red-400', 'bg-teal-500');
            btnBreath.classList.replace('hover:bg-red-500', 'hover:bg-teal-600');
        }

        function breathCycle() {
            breathText.classList.add('show-text');
            
            // Inhale
            breathText.textContent = "Tarik Napas...";
            breathContainer.classList.add('inhale');
            breathContainer.classList.remove('exhale');

            // Exhale after 4s
            setTimeout(() => {
                if(isBreathing) {
                    breathText.textContent = "Hembuskan...";
                    breathContainer.classList.remove('inhale');
                    breathContainer.classList.add('exhale');
                }
            }, 4000);
        }

    </script>
</body>
</html>
